---
- name: Initial kubernetes control-plane
  hosts: master
  become: true
  vars:
    pod_network_cidr: "192.168.0.0/16"
  tasks:
    - name: check if cluster already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_init_check

    - name: run kubeadm init
      command: >
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
      when: not kubeadm_init_check.stat.exists
      register: kubeadm_init_result

    - name: Show kubeadm init output
      debug:
        var: kubeadm_init_result.stdout_lines
      when: kubeadm_init_result is changed

    - name: Create .kube dir for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy admin.conf to user's kube config
      copy: 
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Generate join command
      command: kubeadm token create --print-join-command
      register: join_command_raw

    - name: Save join command to local file
      copy:
        content: "{{ join_command_raw.stdout }}"
        dest: "{{ playbook_dir }}/../join-command.sh"
        mode: '0600'
      delegate_to: localhost
      become: false
